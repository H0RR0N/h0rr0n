<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesna Macarons Courier</title>
    <style>
        :root {
            --bg: #f5f8ff;
            --card: #ffffff;
            --text: #14213d;
            --accent: #fb8500;
        }

        body {
            margin: 0;
            font-family: "Trebuchet MS", sans-serif;
            background: radial-gradient(circle at top right, #e8f1ff, var(--bg));
            color: var(--text);
        }

        .wrap {
            max-width: 900px;
            margin: 24px auto;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 14px 30px rgba(20, 33, 61, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        img {
            width: 80px;
            height: 80px;
            display: block;
            margin-bottom: 16px;
            border-radius: 12px;
        }

        ul {
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <img src="icon.png" alt="Vesna Courier Icon">
            <h1>Vesna Macarons Courier</h1>
            <p>Courier routing foundation with zones, GPX routes, dispatch batches and map visibility.</p>
            <ul>
                <li>Zone-based courier segregation</li>
                <li>Stock picking integration</li>
                <li>Route sheet PDF output</li>
                <li>Website map with route and stop markers</li>
            </ul>
        </div>
    </div>
</body>
</html>
